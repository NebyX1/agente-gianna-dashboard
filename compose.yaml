name: idl-tickets
services:
  mariadb:
    image: mariadb:11.4.8
    environment:
      MARIADB_DATABASE: idl_tickets
      MARIADB_USER: idl_tickets
      MARIADB_PASSWORD: ${DB_PASSWORD:?Ejecutar scripts/init-local.py}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Ejecutar scripts/init-local.py}
    ports: ["127.0.0.1:3307:3306"]
    volumes: ["mariadb_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4.8-alpine
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27.8
    profiles: [development]
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  backend:
    build: ./backend
    image: idl-tickets-backend
    environment:
      APP_ENV: development
      PORT: "5000"
      DATABASE_URI: mariadb+mariadbconnector://idl_tickets:${DB_PASSWORD}@mariadb:3306/idl_tickets
      SECRET_KEY: ${SECRET_KEY:?Ejecutar scripts/init-local.py}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Ejecutar scripts/init-local.py}
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
      DASHBOARD_ALLOWED_ORIGIN: http://localhost:5174
      FRONTEND_URL: http://localhost:5173
      MAIL_SERVER: ${MAIL_SERVER:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-false}
      MAIL_USE_SSL: ${MAIL_USE_SSL:-false}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-Tickets IDL <tickets@example.test>}
      DEFAULT_DESTINATION_UNIT_CODE: TI
      RUN_MIGRATIONS: "true"
    ports: ["127.0.0.1:5000:5000"]
    depends_on:
      mariadb: { condition: service_healthy }
      redis: { condition: service_healthy }
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api/v1
    image: idl-tickets-frontend
    ports: ["127.0.0.1:5173:80"]
    depends_on: { backend: { condition: service_healthy } }
  visualizer:
    build:
      context: ./visualizer
      args:
        VITE_API_BASE_URL: http://localhost:5000/api/v1
    image: idl-tickets-visualizer
    ports: ["127.0.0.1:5174:80"]
    depends_on: { backend: { condition: service_healthy } }
volumes:
  mariadb_data:
  redis_data:
