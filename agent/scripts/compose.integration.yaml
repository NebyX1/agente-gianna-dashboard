services:
  mariadb:
    ports: !override ["127.0.0.1:3309:3306"]
  redis:
    ports: !override ["127.0.0.1:6390:6379"]
  mailpit:
    ports: !override ["127.0.0.1:1027:1025", "127.0.0.1:8027:8025"]
  backend:
    image: idl-tickets-backend-gianna-test
    ports: !override ["127.0.0.1:5400:5000"]
    environment:
      CORS_ORIGINS: http://localhost:5473,http://localhost:5474
      DASHBOARD_ALLOWED_ORIGIN: http://localhost:5474
      FRONTEND_URL: http://localhost:5473
  frontend:
    image: idl-tickets-frontend-design-check
    ports: !override ["127.0.0.1:5473:80"]
    build:
      args:
        VITE_API_URL: http://localhost:5400/api/v1
  visualizer:
    image: idl-tickets-visualizer-design-check
    ports: !override ["127.0.0.1:5474:80"]
    build:
      args:
        VITE_API_BASE_URL: http://localhost:5400/api/v1
        VITE_REFRESH_INTERVAL_MS: "1000"
        VITE_PAGE_INTERVAL_MS: "5000"
