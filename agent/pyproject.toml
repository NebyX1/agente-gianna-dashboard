[project]
name = "gianna"
version = "0.1.0"
description = "Asistente de voz local de la Intendencia de Lavalleja"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.135.1",
  "uvicorn==0.41.0",
  "httpx==0.28.1",
  "pydantic==2.12.5",
  "pydantic-settings==2.13.1",
  "jsonschema==4.26.0",
  "aiosqlite==0.22.1",
  "pipecat-ai[whisper,piper,webrtc]==1.10.0",
  "faster-whisper==1.2.1",
  "ctranslate2==4.8.2",
  "pyrnnoise==0.4.3",
  "audiolab==0.4.9",
  "av==17.0.0",
  "piper-tts==1.4.2",
  "playwright==1.58.0",
  "keyring==25.7.0",
  "huggingface-hub==0.36.2",
  "numpy>=2,<3",
  "scipy>=1.15,<2",
  "psutil>=7,<8",
]

[dependency-groups]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "ruff==0.15.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gianna"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
markers = ["models: requiere modelos locales", "gpu: requiere CUDA", "integration: servicios reales", "e2e: navegador real"]

[tool.ruff]
line-length = 100
