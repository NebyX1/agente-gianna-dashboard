server {
 listen 80; server_name _; root /usr/share/nginx/html; index index.html;
 gzip on; gzip_types text/css application/javascript application/json image/svg+xml;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options SAMEORIGIN always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 location = /healthz { default_type text/plain; return 200 "ok\n"; }
 location ^~ /api/ { default_type application/json; return 404 '{"error":"API disponible en el dominio del backend"}'; }
 location ^~ /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; add_header X-Content-Type-Options nosniff always; }
 location = /index.html { add_header Cache-Control "no-store"; add_header X-Content-Type-Options nosniff always; }
 location ~* \.(js|css|map|png|svg|ico|webp|woff2?)$ { try_files $uri =404; add_header Cache-Control "no-cache"; }
 location / { try_files $uri $uri/ /index.html; }
}
