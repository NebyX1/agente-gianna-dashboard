services:
  mariadb:
    ports: !override ["127.0.0.1:3308:3306"]
  redis:
    ports: !override ["127.0.0.1:6380:6379"]
  mailpit:
    ports: !override ["127.0.0.1:1026:1025", "127.0.0.1:8026:8025"]
  backend:
    image: idl-tickets-backend-e2e
    ports: !override ["127.0.0.1:5300:5000"]
    environment:
      CORS_ORIGINS: http://localhost:5373,http://localhost:5374
      DASHBOARD_ALLOWED_ORIGIN: http://localhost:5374
      FRONTEND_URL: http://localhost:5373
  frontend:
    image: idl-tickets-frontend-e2e
    ports: !override ["127.0.0.1:5373:80"]
    build:
      args:
        VITE_API_URL: http://localhost:5300/api/v1
  visualizer:
    image: idl-tickets-visualizer-e2e
    ports: !override ["127.0.0.1:5374:80"]
    build:
      args:
        VITE_API_BASE_URL: http://localhost:5300/api/v1
        VITE_REFRESH_INTERVAL_MS: "1000"
        VITE_PAGE_INTERVAL_MS: "5000"
